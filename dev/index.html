<body>
<div class="atmos" aria-hidden="true"></div>

<header class="top">
  <a class="back" href="/">&larr; SZVTECH</a>
  <span class="top-note mono">runs in your browser</span>
</header>

<main id="app">
  <section class="hero">
    <span class="label mono">Dev toolbox</span>
    <h1>Paste it. <span class="grad">Fix it.</span></h1>
    <p class="lede">Eleven small tools, one page. Nothing you type leaves this device.</p>

    <div class="paste glass" id="paste">
      <label class="lab mono" for="smart">Smart paste</label>
      <div class="paste-row">
        <textarea id="smart" rows="2" spellcheck="false" autocomplete="off" autocapitalize="off" autocorrect="off" placeholder="Paste a token, JSON, color, time&hellip;" aria-label="Paste anything to find the right tool"></textarea>
        <button class="btn ghost" id="pasteBtn" type="button" hidden>Paste</button>
      </div>
      <div class="sugg" id="sugg" aria-live="polite"></div>
    </div>
  </section>

  <nav class="tabs-wrap" aria-label="Tools">
    <div class="tabs" id="tabs" role="tablist"></div>
  </nav>

  <div id="panels"></div>
  <p class="foot mono">No uploads &middot; No tracking &middot; Nothing is saved but your last tab</p>
</main>

<noscript><p class="ns">The toolbox needs JavaScript.</p></noscript>

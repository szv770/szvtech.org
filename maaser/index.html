<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Maaser · SZVTECH</title>
<meta name="description" content="A private giving ledger and maaser calculator. Everything stays on your device.">
<meta name="theme-color" content="#05050a">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='.55' stop-color='%23e879f9'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2305050a'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='url(%23g)' stroke-width='4.5'/%3E%3Cpath d='M32 25v14M27 29h8' fill='none' stroke='url(%23g)' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="/assets/theme.js?v=8c7e276563"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/maaser/maaser.css?v=aa9d9c3be3">
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<header class="top">
  <a class="back" href="/">&larr; SZVTECH</a>
  <div class="top-r">
    <button class="chip" id="setBtn" type="button" aria-label="Settings">Settings</button>
    <button class="chip icon" id="infoBtn" type="button" aria-label="About maaser and privacy">i</button>
    <button class="szv-sharebtn" data-szv-share aria-label="Share"></button>
  </div>
</header>

<main id="app">
  <h1 class="title">Maaser</h1>
  <p class="lede">Your private giving ledger. It never leaves this device.</p>

  <section class="card hero" id="hero" aria-live="polite"></section>
  <div class="cta">
    <button type="button" class="btn big in" data-add="i"><span class="plus" aria-hidden="true">+</span>Got paid</button>
    <button type="button" class="btn big out" data-add="g"><span class="plus" aria-hidden="true">+</span>I gave</button>
  </div>

  <section class="card calc" aria-label="Quick calculator">
    <div class="lab">Quick calculator</div>
    <label class="cq" for="calcIn">What&rsquo;s maaser on&hellip;</label>
    <div class="cin"><span class="cur" id="calcCur" aria-hidden="true">$</span><input id="calcIn" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="done" placeholder="0" aria-label="Amount to calculate on"></div>
    <div class="ctiles" id="ctiles"></div>
  </section>

  <section class="card year" id="year" aria-label="Year summary"></section>

  <section class="ledger" id="ledger" aria-label="Ledger"></section>

  <p class="foot">Saved only in this browser. Back it up from Settings.</p>
</main>

<div class="sheet-back" id="sheetBack" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button type="button" id="toastUndo" hidden>Undo</button></div>
<div id="receipt" aria-hidden="true"></div>

<noscript><p class="ns">Maaser needs JavaScript.</p></noscript>
<script type="module" src="/maaser/maaser.js?v=9f60997b5f"></script>
<script type="module" src="/assets/chrome.js?v=003ccd2461"></script>
</body>
</html>

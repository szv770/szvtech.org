
<!DOCTYPE html>
<html lang="en" class="bg-[#f0f2f5] text-slate-900 overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AETHER LIGHT // Intelligence Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent-primary: #0ea5e9;
            --accent-secondary: #6366f1;
            --bg-base: #f8fafc;
        }
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(14, 165, 233, 0.05) 0, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.05) 0, transparent 40%);
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .glass-panel {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05);
        }

        .cyber-card {
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cyber-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -20px rgba(14, 165, 233, 0.3);
            border-color: var(--accent-primary);
        }

        @keyframes data-flow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .futuristic-progress {
            background: linear-gradient(90deg, #0ea5e9, #6366f1, #0ea5e9);
            background-size: 200% auto;
            animation: data-flow 2s linear infinite;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="min-h-[100dvh]">
    <div id="root"></div>
</body>
</html>

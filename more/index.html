<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Access Console</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #020617;
  --panel: #020617;
  --accent: #22d3ee;
  --danger: #ef4444;
  --ok: #22c55e;
  --muted: #6b7280;
  --text: #e5e7eb;
}

* {
  box-sizing: border-box;
  font-family: "JetBrains Mono", monospace;
}

body {
  margin: 0;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: var(--text);
  min-height: 100vh;
}

.container {
  max-width: 520px;
  margin: auto;
  padding: 20px;
}

.header {
  border: 1px solid #1f2937;
  border-radius: 14px;
  padding: 16px;
  background: linear-gradient(180deg, #020617, #020617);
  box-shadow: 0 0 40px rgba(34,211,238,.15);
}

.header h1 {
  margin: 0;
  font-size: 1.1rem;
  letter-spacing: .08em;
}

.header span {
  color: var(--accent);
}

.screen {
  margin-top: 16px;
  background: #020617;
  border: 1px solid #1f2937;
  border-radius: 14px;
  padding: 16px;
  height: 60vh;
  overflow-y: auto;
}

.log {
  font-size: .8rem;
  line-height: 1.4;
  margin-bottom: 6px;
}

.log.info { color: var(--accent); }
.log.warn { color: var(--danger); }
.log.ok { color: var(--ok); }
.log.muted { color: var(--muted); }

.controls {
  margin-top: 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button {
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #1f2937;
  background: #020617;
  color: var(--text);
  font-size: .75rem;
  letter-spacing: .05em;
}

button.primary {
  border-color: var(--accent);
  box-shadow: 0 0 18px rgba(34,211,238,.25);
}

button.danger {
  border-color: var(--danger);
}

button:active {
  transform: scale(.97);
}

.footer {
  text-align: center;
  font-size: .65rem;
  color: var(--muted);
  margin-top: 10px;
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>REMOTE ACCESS <span>CONSOLE</span></h1>
  </div>

  <div id="screen" class="screen">
    <div class="log muted">[ system idle ]</div>
    <div class="log muted">Awaiting operator input…</div>
  </div>

  <div class="controls">
    <button class="primary" onclick="connect()">INITIATE LINK</button>
    <button onclick="scan()">RUN SCAN</button>
    <button onclick="bruteforce()">ATTEMPT ACCESS</button>
    <button class="danger" onclick="abort()">ABORT SESSION</button>
  </div>

  <div class="footer">
    Simulated environment · Actions monitored · No live targets
  </div>

</div>

<script>
const screen = document.getElementById("screen");

function log(text, type="info") {
  const div = document.createElement("div");
  div.className = "log " + type;
  div.textContent = text;
  screen.appendChild(div);
  screen.scrollTop = screen.scrollHeight;
}

function connect() {
  log("[*] Initializing secure channel…");
  setTimeout(() => log("[*] Negotiating handshake…"), 600);
  setTimeout(() => log("[+] Encrypted tunnel established", "ok"), 1200);
}

function scan() {
  log("[*] Scanning target surface…");
  let ports = ["443", "80", "22", "8080"];
  ports.forEach((p, i) => {
    setTimeout(() => log(`[+] Port ${p} responded`, "info"), 500 * (i+1));
  });
}

function bruteforce() {
  log("[!] Access attempt initiated", "warn");
  setTimeout(() => log("[*] Testing credential vectors…"), 700);
  setTimeout(() => log("[*] Rate-limit detected", "warn"), 1400);
  setTimeout(() => log("[x] Access denied", "danger"), 2100);
}

function abort() {
  log("[!] Operator aborted session", "warn");
  setTimeout(() => log("[ system idle ]", "muted"), 600);
}
</script>

</body>
</html>

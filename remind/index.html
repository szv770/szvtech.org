<body>
<div class="atmos" aria-hidden="true"></div>

<header class="top">
  <a class="back" href="/">&larr; SZVTECH</a>
  <div class="top-r">
    <button class="chip" id="menuBtn" type="button" aria-haspopup="dialog">Alerts &amp; backup</button>
  </div>
</header>

<main id="app">
  <div class="title-row">
    <h1>Remind</h1>
    <span class="sync mono" id="syncState" aria-live="polite"></span>
  </div>
  <div id="stage" aria-live="off"></div>
  <p class="honest" id="honest">
    <b>Alerts only ring while this page is open.</b> A website can&rsquo;t wake your phone when it&rsquo;s closed.
    For something you can&rsquo;t miss, tap <em>Add to phone calendar</em> on a reminder.
    <button class="link" id="enableAlerts" type="button" hidden>Turn on alerts</button>
  </p>
</main>

<button class="fab" id="addBtn" type="button" aria-label="New reminder"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>

<div class="sheet-back" id="sheetBack" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Reminder" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-body" id="sheetBody"></div>
</section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<noscript><p class="ns">Remind needs JavaScript.</p></noscript>

<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700;800&family=Syne:wght@600;700&display=swap" rel="stylesheet">

<body>
<div id="bg" aria-hidden="true"></div>

<header class="top">
  <a class="back" href="/">&larr; SZVTECH</a>
  <div class="top-r">
    <button class="chip icon" id="openSettings" type="button" aria-label="Settings and backup"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M4.6 7.4l2.2 1.3M17.2 15.3l2.2 1.3M4.6 16.6l2.2-1.3M17.2 8.7l2.2-1.3"/></svg></button>
    <button class="szv-sharebtn" data-szv-share aria-label="Share"></button>
  </div>
</header>

<main id="app">
  <div id="banner"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="insights" aria-selected="false">Insights</button>
    <button role="tab" data-tab="log" aria-selected="false">Log</button>
  </nav>
  <div id="view" aria-live="polite"></div>
  <footer class="foot"><p>Everything here stays on this device. Export a backup from the gear whenever you like.</p></footer>
</main>

<div class="sheet-back" id="sheetBack" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Options" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div id="sheetBody"></div>
</section>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<noscript><p class="ns">Seder needs JavaScript.</p></noscript>
<script type="module" src="/seder/seder.js?v=cd6668e7a9"></script>
<script type="module" src="/assets/chrome.js?v=003ccd2461"></script>
</body>
</html>

<body class="is-locked">

<div class="grain" aria-hidden="true"></div>

<!-- ======================================================================= -->
<!-- LOGIN GATE                                                              -->
<!-- ======================================================================= -->
<section class="gate" id="gate" aria-label="Restricted login">
  <div class="gate__card">
    <div class="gate__top mono">
      <span class="dotrow" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="gate__host">root@szv-ops-01</span>
      <span class="gate__sec"><span class="live"></span> SECURE</span>
    </div>
    <div class="gate__body">
      <div class="gate__badge mono" aria-hidden="true">// RESTRICTED</div>
      <h1 class="gate__title">Internal Control Panel</h1>
      <p class="gate__sub mono">authorized personnel only &middot; all sessions are logged</p>

      <form class="gate__form" id="loginForm" autocomplete="off" novalidate>
        <label class="field">
          <span class="field__k mono">operator</span>
          <input class="field__i mono" id="user" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="e.g. admin" aria-label="operator">
        </label>
        <label class="field">
          <span class="field__k mono">passphrase</span>
          <input class="field__i mono" id="pass" type="password" autocomplete="new-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" aria-label="passphrase">
        </label>
        <button class="btn btn--go" id="loginBtn" type="submit"><span class="btn__ps" aria-hidden="true">&gt;_</span> AUTHENTICATE</button>
        <button class="btn btn--sql" id="sqlBtn" type="button" title="paste known bypass">try bypass string</button>
      </form>

      <div class="gate__out mono" id="gateOut" aria-live="polite"></div>
      <div class="gate__foot mono">
        <span>build <b>staging-0.9.3-rc2</b></span>
        <span class="gate__hint">hint: the box has been misconfigured since the last deploy</span>
      </div>
    </div>
  </div>
</section>

<!-- ======================================================================= -->
<!-- CONSOLE (post-login maze)                                               -->
<!-- ======================================================================= -->
<main class="console" id="console" hidden aria-label="Control panel">
  <header class="top">
    <div class="top__brand mono">
      <span class="top__mark" aria-hidden="true"></span>
      <span>SZV-OPS</span><span class="top__env">staging</span>
    </div>
    <div class="top__mid mono" id="crumbs" aria-live="polite">// you shouldn&rsquo;t be here</div>
    <div class="top__right mono">
      <span class="access" id="accessPill">ACCESS LVL <b id="accLvl">1</b>/7</span>
      <button class="chip" id="logoutBtn" type="button">lock</button>
    </div>
  </header>

  <div class="layout">
    <nav class="side" aria-label="Sections">
      <button class="nav" data-view="overview" aria-current="true"><i>&#9632;</i> overview</button>
      <button class="nav" data-view="users"><i>&#9783;</i> user database</button>
      <button class="nav" data-view="files"><i>&#9707;</i> file browser</button>
      <button class="nav" data-view="logs"><i>&#9776;</i> live logs</button>
      <button class="nav" data-view="console"><i>&gt;_</i> root console</button>
      <button class="nav nav--locked" data-view="vault"><i>&#128274;</i> master vault</button>
      <div class="side__flags mono">
        <span class="side__flags-k">flags found</span>
        <span class="side__flags-v"><b id="flagCount">0</b> / 3</span>
      </div>
    </nav>

    <section class="main" id="main" tabindex="-1">
      <!-- views injected by sys.js -->
    </section>
  </div>
</main>

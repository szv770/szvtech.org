<!doctype html>
<html lang="en" data-theme-keys="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Climate · SZVTECH</title>
<meta name="theme-color" content="#05050a">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='.55' stop-color='%23e879f9'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2305050a'/%3E%3Cpath d='M32 12v40M15 22l34 20M15 42l34-20' fill='none' stroke='url(%23g)' stroke-width='4.5' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="/assets/theme.js?v=8c7e276563"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ac/ac.css?v=7f36e4d97c">
</head>
<body>
<a class="home" href="/">&larr; SZVTECH</a>
<div class="atmos" aria-hidden="true"></div>

<main class="stage">
 <div class="cq">
  <section class="unit" id="unit" aria-label="Air conditioner remote">
    <div class="vent" aria-hidden="true">
      <i></i><i></i><i></i><i></i><i></i><i></i>
    </div>
    <div class="air" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b><b></b><b></b></div>

    <div class="screen" id="screen">
      <div class="s-top">
        <span class="s-mode"><svg id="modeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg><span id="modeName">COOL</span></span>
        <span class="s-room" id="roomName">Living Room</span>
      </div>
      <div class="s-temp" role="status" aria-live="polite" aria-label="Target temperature">
        <span class="num" id="target">72</span><span class="deg" id="unitLabel">°F</span>
      </div>
      <div class="s-mid">
        <span class="lbl">Room</span><span class="room-t" id="roomT">78°</span>
        <span class="fan" id="fanBars" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="lbl" id="fanName">AUTO</span>
      </div>
      <div class="s-status" id="status">Cooling to 72°</div>
      <div class="s-foot"><span>Filter</span><span>Imaginary</span></div>
      <div class="s-off" id="offMsg">Standby</div>
    </div>

    <div class="pad">
      <button class="btn round big" id="down" aria-label="Lower temperature"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
      <button class="btn power" id="power" aria-label="Power" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.6 6.6a8 8 0 1 0 10.8 0"/></svg></button>
      <button class="btn round big" id="up" aria-label="Raise temperature"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
    </div>
    <div class="pad two">
      <button class="btn pill" id="modeBtn"><span class="lbl">Mode</span><span id="modeBtnV">Cool</span></button>
      <button class="btn pill" id="fanBtn"><span class="lbl">Fan</span><span id="fanBtnV">Auto</span></button>
    </div>

    <button class="pencil" id="pencil" aria-label="Edit settings"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/></svg></button>
  </section>
 </div>
</main>

<div class="sheet-back" id="back" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab" aria-hidden="true"></div>
  <h2 id="sheetTitle">Edit</h2>
  <div class="rows">
    <label class="row"><span class="lbl">Room name</span><input id="eRoom" maxlength="24" autocomplete="off" spellcheck="false"></label>
    <div class="row"><span class="lbl">Target</span>
      <div class="step"><button class="btn round" id="eTDown" aria-label="Lower target">&minus;</button><output id="eTVal">72°</output><button class="btn round" id="eTUp" aria-label="Raise target">+</button></div></div>
    <div class="row"><span class="lbl">Room temperature</span>
      <div class="step"><button class="btn round" id="eRDown" aria-label="Lower room temperature">&minus;</button><output id="eRVal">78°</output><button class="btn round" id="eRUp" aria-label="Raise room temperature">+</button></div></div>
    <div class="row"><span class="lbl">Unit</span><div class="chips" id="eUnit" role="group"></div></div>
    <div class="row"><span class="lbl">Mode</span><div class="chips" id="eMode" role="group"></div></div>
    <div class="row"><span class="lbl">Fan</span><div class="chips" id="eFan" role="group"></div></div>
    <label class="row"><span class="lbl">Status line <em>(blank = automatic)</em></span><input id="eStatus" maxlength="40" autocomplete="off" spellcheck="false" placeholder="Cooling to 72°"></label>
    <label class="row check"><input type="checkbox" id="eDrift"><span>Room temp slowly drifts toward target</span></label>
  </div>
  <div class="actions">
    <button class="btn pill ghost" id="eReset">Reset</button>
    <button class="btn pill solid" id="eDone">Done</button>
  </div>
</section>

<script src="/ac/ac.js?v=a289a297ee"></script>
</body>
</html>

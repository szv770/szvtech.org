<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tehillim · SZVTECH</title>
<meta name="description" content="Today's Tehillim by the Hebrew date, weekly or any chapter, with a calm reader and your own tracking.">
<meta name="theme-color" content="#05050a">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='.55' stop-color='%23e879f9'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2305050a'/%3E%3Cpath d='M32 18v28M32 18c-5-4-12-4-18-2v28c6-2 13-2 18 2 5-4 12-4 18-2V16c-6-2-13-2-18 2z' fill='none' stroke='url(%23g)' stroke-width='4.5' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="/assets/theme.js?v=8c7e276563"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&family=Noto+Serif+Hebrew:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tehillim/tehillim.css?v=527117bd1c">
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<header class="top">
  <a class="back" href="/">&larr; SZVTECH</a>
  <div class="top-r">
    <button class="chip icon" id="openSettings" type="button" aria-label="Reading settings"><span lang="he" aria-hidden="true">א</span><small aria-hidden="true">a</small></button>
    <button class="szv-sharebtn" data-szv-share aria-label="Share"></button>
  </div>
</header>

<main id="app">
  <section class="hero card" id="hero" aria-live="polite">
    <div class="skel" aria-hidden="true"></div>
  </section>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Which Tehillim">
    <button role="tab" data-mode="month" aria-selected="true">Month</button>
    <button role="tab" data-mode="week" aria-selected="false">Week</button>
    <button role="tab" data-mode="any" aria-selected="false">Any chapter</button>
  </nav>

  <section class="card" id="setCard" aria-label="Chapters in this set"></section>

  <section class="card" id="namesCard" aria-label="Say for someone"></section>

  <section class="card" id="offlineCard" aria-label="Offline"></section>

  <footer class="foot">
    <p>Hebrew text: <i>Miqra according to the Masorah</i>, from <a href="https://www.sefaria.org/" target="_blank" rel="noopener noreferrer">Sefaria.org</a> (CC BY-SA). Chapters you open are kept on this device. Your marks and names never leave it.</p>
  </footer>
</main>

<!-- reader -->
<div id="reader" class="reader" role="dialog" aria-modal="true" aria-label="Tehillim reader" hidden>
  <header class="r-top">
    <button class="chip icon" id="rClose" type="button" aria-label="Close reader">&#x2715;</button>
    <div class="r-title">
      <div class="r-he" id="rHe" lang="he" dir="rtl"></div>
      <div class="r-sub mono" id="rSub"></div>
    </div>
    <button class="chip icon" id="rSettings" type="button" aria-label="Reading settings"><span lang="he" aria-hidden="true">א</span><small aria-hidden="true">a</small></button>
  </header>
  <div class="r-bar" aria-hidden="true"><i id="rBar"></i></div>
  <div class="r-scroll" id="rScroll">
    <div class="r-inner">
      <div id="rNames"></div>
      <article id="rText" class="text" lang="he" dir="rtl"></article>
      <div class="r-end" id="rEnd"></div>
    </div>
  </div>
  <footer class="r-bot">
    <button class="rb nav" id="rPrev" type="button" aria-label="Previous chapter">&lsaquo;</button>
    <button class="rb main" id="rSay" type="button"><span class="ck" aria-hidden="true"></span><span id="rSayT">Mark as said</span></button>
    <button class="rb nav" id="rNext" type="button" aria-label="Next chapter">&rsaquo;</button>
  </footer>
  <div class="done" id="done" hidden></div>
</div>

<div class="sheet-back" id="sheetBack" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Options" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div id="sheetBody"></div>
</section>
<div id="toast" role="status" aria-live="polite"></div>

<noscript><p class="ns">Tehillim needs JavaScript.</p></noscript>
<script type="module" src="/tehillim/tehillim.js?v=5addb733d6"></script>
<script type="module" src="/assets/chrome.js?v=cd8ddbdb8a"></script>
</body>
</html>
